<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخزن الذكي - سحابي</title>
    
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="المخزن الذكي">
    
    <!-- إعدادات التثبيت التلقائي PWA -->
    <script>
    const manifestData = {
        "name": "المخزن الذكي",
        "short_name": "المخزن الذكي",
        "start_url": "/Almakzan-/",
        "scope": "/Almakzan-/",
        "display": "standalone",
        "background_color": "#ffffff",
        "theme_color": "#2563eb",
        "icons": [{
            "src": "[https://i.ibb.co/6803248/icon.png](https://i.ibb.co/6803248/icon.png)",
            "sizes": "512x512",
            "type": "image/png"
        }]
    };
    const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
    </script>
</head>
<body>
    <!-- محتوى التطبيق -->
</body>
</html>
